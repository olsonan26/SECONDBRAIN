name: Brain recovery backup
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Snapshot configured data, select recovery/complete explicitly, or verify tools
        type: choice
        options: [snapshot, recovery-snapshot, complete-snapshot, verify-tools, assemble-sources]
        default: snapshot
      seed_tag:
        description: Encrypted seed release for source assembly (only used by assemble-sources)
        type: string
        default: brain-backup-source-seed-20261021
      backend:
        description: Source containing the real workspace (empty/unmigrated storage is rejected)
        type: choice
        options: [current, blob, supabase]
        default: current
  schedule:
    - cron: '23 8 * * *'
permissions:
  contents: write
concurrency:
  group: secondbrain-recovery-backup
  cancel-in-progress: false
jobs:
  snapshot:
    # Activation first exports, restores and publishes a verified snapshot.
    # Recovery mode protects current Supabase data without claiming the legacy
    # Vercel-only records have been recovered. Normal complete guards stay strict.
    if: inputs.operation != 'assemble-sources' && (github.event_name == 'workflow_dispatch' || vars.BRAIN_BACKUP_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify encrypted backup and recovery safeguards
        run: node --import tsx --test tests/backup*.test.ts
      - name: Back up current data (recovery mode keeps legacy cloud incomplete)
        if: inputs.operation != 'verify-tools'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAIN_BACKUP_KEY: ${{ secrets.BRAIN_BACKUP_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BRAIN_SUPABASE_URL: ${{ secrets.BRAIN_SUPABASE_URL }}
          BRAIN_SUPABASE_GATEWAY_TOKEN: ${{ secrets.BRAIN_SUPABASE_GATEWAY_TOKEN }}
          BRAIN_BACKUP_BACKEND: ${{ (inputs.backend != '' && inputs.backend != 'current' && inputs.backend) || vars.BRAIN_BACKUP_BACKEND || 'blob' }}
          BRAIN_BACKUP_MODE: ${{ (inputs.operation == 'recovery-snapshot' && 'recovery') || (inputs.operation == 'complete-snapshot' && 'complete') || vars.BRAIN_BACKUP_MODE || 'complete' }}
        run: |
          if [ "$BRAIN_BACKUP_MODE" = "recovery" ]; then
            archive_mode=recovery-snapshot
            tag_kind=recovery
          elif [ "$BRAIN_BACKUP_MODE" = "complete" ]; then
            archive_mode=cloud
            tag_kind=cloud
          else
            echo "Unknown backup mode; no snapshot was published."
            exit 1
          fi
          node --import tsx scripts/brain-backup.ts "$archive_mode" private/github-backups/cloud
          node --import tsx scripts/brain-backup.ts restore private/github-backups/cloud private/github-backups/restored-verification
          node --import tsx scripts/brain-backup.ts publish private/github-backups/cloud "brain-backup-${tag_kind}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
  original-sources:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'assemble-sources'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Assemble and verify original sources directly from Drive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRAIN_BACKUP_KEY: ${{ secrets.BRAIN_BACKUP_KEY }}
          BRAIN_SOURCE_SEED_TAG: ${{ inputs.seed_tag }}
        run: node --import tsx scripts/assemble-source-backup.ts
